<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" 
            rel="stylesheet">
    <link rel="stylesheet" href="entrar.css">
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <title>EcoWatt 2</title>

</head>
<body>

    <main>

            <a href="inicio.html" class="bnt-voltar">
            <i class="fa-solid fa-arrow-left"></i>
            </a>

            <img src="/imagens/EcoWatt_logo_sem_borda_preta.png" alt="Logo do EcoWatt">

            <h2>
                Eco<span class="destaque">Watt</span>
            </h2>

            <p>Faça login para continuar e <br>acompanhar seu consumo.</p>

        <div class="grupo-input">

                <i class="fa-regular fa-envelope"></i>

                 <input 
                type="email"
                name="email"
                placeholder="Digite seu e-mail"
                autocomplete="email">
        </div>
            
        <div class="grupo-input">

            <i class="fa-solid fa-lock" aria-hidden="true"></i>

            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
                autocomplete="current-password"
                >

            <button
                    type="button"
                    class="botao-olho"
                    id="mostrarSenha"
                    aria-label="Mostrar senha"
                >

            <i class="fa-regular fa-eye" aria-hidden="true"></i>
            </button>
        </div>

          <a href="">Esqueci minha senha</a>

        <a href="">Entrar</a>
        <a href="">Criar conta</a>

        <p>Ao continuar, você concorda com nossos<br>
            Termos de uso e Política de Privacidade.</p>
</main>

</body>
</html>
